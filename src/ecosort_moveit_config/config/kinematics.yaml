ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  # KDL es un solver local (Newton-Raphson): con 0.005s a veces no le da
  # tiempo a converger para poses perfectamente alcanzables (visto en
  # pruebas: la misma orientación/altura funcionó para un objeto y falló
  # para otros dos). Se sube a 0.2s para darle más intentos internos.
  kinematics_solver_timeout: 0.2
